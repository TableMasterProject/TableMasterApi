services:
  postgres:
    image: postgres:18-alpine
    container_name: TableMasterDataBase-${NAME_ENV}
    hostname: TableMaster
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${DB_NAME:-TableMaster}"
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-TableMaster}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - postgres-network

  api:
    image: ghcr.io/tablemasterproject/tablemaster-api:${API_IMAGE_TAG:-prod}
    container_name: TableMasterApi-${NAME_ENV}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      APP_VERSION: "${APP_VERSION:-local}"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=${DB_PORT:-5432};Database=${DB_NAME:-TableMaster};Username=${DB_USER:-postgres};Password=${DB_PASSWORD};"
      ConfigPerso__SecretKey: "${JWT_SECRET}"
      ConfigPerso__Issuer: "${JWT_ISSUER:-TableMasterApi}"
      ConfigPerso__Audience: "${JWT_AUDIENCE:-TableMasterApi}"
      ConfigPerso__KeyApiGoogleMaps: "${GOOGLE_MAPS_API_KEY}"
      ConfigPerso__FirebaseServiceAccountPath: "${FIREBASE_SERVICE_ACCOUNT_PATH:-tablemaster-firebase.json}"
      Cors__AllowedOrigins__0: "${CORS_ALLOWED_ORIGIN}"
      Brevo__Enabled: "${BREVO_ENABLED:-true}"
      Brevo__ApiKey: "${BREVO_API_KEY}"
      Brevo__BaseUrl: "${BREVO_BASE_URL:-https://api.brevo.com/v3/}"
      Brevo__SenderEmail: "${BREVO_SENDER_EMAIL}"
      Brevo__SenderName: "${BREVO_SENDER_NAME:-TableMaster}"
      AppLinks__BaseUrl: "${APP_LINKS_BASE_URL}"
      AppLinks__FallbackScheme: "${APP_LINKS_FALLBACK_SCHEME:-tablemaster}"
      AppLinks__PasswordResetPath: "${APP_LINKS_PASSWORD_RESET_PATH:-/reset-password}"
      AppLinks__ReservationPath: "${APP_LINKS_RESERVATION_PATH:-/reservations/{reservationId}}"
      Sentry__Dsn: "${SENTRY_DSN}"
      Sentry__Environment: "production"
      Sentry__Release: "${SENTRY_RELEASE:-tablemaster-api@local}"
      Sentry__Debug: "${SENTRY_DEBUG:-false}"
      Sentry__TracesSampleRate: "${SENTRY_TRACES_SAMPLE_RATE:-0.1}"
      Sentry__SendDefaultPii: "${SENTRY_SEND_DEFAULT_PII:-false}"
      Features__RunMigrationsOnStartup: "${RUN_MIGRATIONS_ON_STARTUP:-true}"
      Features__EnableSwagger: "${ENABLE_SWAGGER:-false}"
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./tablemaster-firebase.json:/App/tablemaster-firebase.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - postgres-network

networks:
  postgres-network:
    driver: bridge

volumes:
  postgres18-data:
