version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: TableMasterDataBase-${NAME_ENV}
    hostname: TableMaster
    ports:
      - "${DB_PORT}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: always
    networks:
      - sqlserver-network

  api:
    build: .
    container_name: TableMasterApi-${NAME_ENV}
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=TableMaster;User Id=sa;Password=${DB_PASSWORD};Encrypt=False;TrustServerCertificate=True;
    ports:
      - "${API_PORT}:8080"
    restart: always
    networks:
      - sqlserver-network

networks:
  sqlserver-network:
    driver: bridge

volumes:
  sqlserver-data:
