# Configuration Nginx de référence pour l'API TableMaster.
#
# La configuration réellement en service sur le VPS n'est pas versionnée : ce
# fichier sert de référence à comparer avec /etc/nginx/sites-available/ lors
# d'un incident ou d'une réinstallation.
#
# Point critique : le client Flutter se connecte au hub SignalR avec
# `skipNegotiation: true` et `transport: WebSockets`
# (TableMasterMobile/lib/core/signalr_service.dart). Aucun repli en
# Server-Sent Events ou long polling n'est possible : si l'upgrade WebSocket
# échoue, le temps réel ne fonctionne pas du tout.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Format réservé au hub : $uri exclut volontairement la query string qui
# contient le JWT `access_token` imposé par l'API WebSocket des navigateurs.
log_format tablemaster_hub_no_args '$remote_addr - $remote_user [$time_local] '
                                   '"$request_method $uri $server_protocol" '
                                   '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 443 ssl;
    server_name api.tablemaster.lmpe.ovh;

    # ssl_certificate / ssl_certificate_key : gérés par Certbot (Let's Encrypt)

    # Hub SignalR : nécessite l'upgrade WebSocket et un timeout de lecture
    # supérieur au KeepAliveInterval du serveur (10 s, cf. Program.cs).
    location /reservationHub {
        access_log /var/log/nginx/access.log tablemaster_hub_no_args;

        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Une connexion SignalR est longue par nature : sans cela Nginx la
        # coupe au bout de 60 s (valeur par défaut).
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;

        # La mise en tampon casse le flux temps réel.
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
